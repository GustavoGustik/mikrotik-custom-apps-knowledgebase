# yaml-language-server: $schema=https://tikoci.github.io/restraml/routeros-app-yaml-schema.latest.json
# Node-RED — low-code automation platform
# Deploy: /app add disabled=no network=bridge1 yaml=[/file get nodered.app.yml contents]
name: nodered
descr: Low-code programming for event-driven applications
page: https://nodered.org
category: automation
services:
  nodered:
    image: docker.io/nodered/node-red:latest
    ports:
      - 1880:1880:web
    volumes:
      - node_red_data:/data
    restart: unless-stopped
